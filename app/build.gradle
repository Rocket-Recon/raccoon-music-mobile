plugins {
    id 'com.android.application'
}

def numeroDaVersao = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'com.raccoon.music'
    compileSdk 34

    defaultConfig {
        applicationId 'com.raccoon.music'
        minSdk 24
        targetSdk 34
        versionCode numeroDaVersao
        versionName '1.0.0'
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
        buildConfigField 'String', 'REPO', '"' + (System.getenv('GITHUB_REPOSITORY') ?: '') + '"'
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        chave {
            if (System.getenv('CHAVE_ARQUIVO')) {
                storeFile file(System.getenv('CHAVE_ARQUIVO'))
                storeType 'pkcs12'
                storePassword 'raccoon-music'
                keyAlias 'raccoon'
                keyPassword 'raccoon-music'
            }
        }
    }

    buildTypes {
        debug {
            if (System.getenv('CHAVE_ARQUIVO')) signingConfig signingConfigs.chave
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

configurations.all {
    // o Kotlin 1.8+ ja traz o que ficava nos modulos jdk7/jdk8; manter os dois gera classes duplicadas
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-session:1.3.1'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.guava:guava:32.1.3-android'
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.17.3'
}
