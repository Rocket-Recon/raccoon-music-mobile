name: Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Icones
        run: python3 gerar_icones.py

      - name: Compilar
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Separar o APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Raccoon-Music-Mobile.apk

      - name: Publicar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-latest
          name: Raccoon Music Mobile
          body: APK mais recente do Raccoon Music para Android.
          files: Raccoon-Music-Mobile.apk
